version: '3.8'

services:
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - certbot-etc:/etc/letsencrypt
    depends_on:
      - frontend
      - backend
    networks:
      - app-network

  frontend:
    build:
      context: ./next
      dockerfile: Dockerfile
    expose:
      - "3000"
    networks:
      - app-network

  backend:
    build:
      context: ./laravel
      dockerfile: Dockerfile
    expose:
      - "9000"
    depends_on:
      - db
    environment:
      - APP_ENV=production
      - DB_HOST=db
      - DB_DATABASE=your_app
      - DB_USERNAME=laravel
      - DB_PASSWORD=your_password
    networks:
      - app-network

  db:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: your_app
      MYSQL_USER: laravel
      MYSQL_PASSWORD: your_password
    volumes:
      - db-data:/var/lib/mysql
    networks:
      - app-network

volumes:
  certbot-etc:
  db-data:

networks:
  app-network:
    driver: bridge
